<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star of Life loader master gallery</title>
<style>
  html,body{margin:0;background:#0F1724;color:#E6EDF7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  main{max-width:1160px;margin:0 auto;padding:32px 20px 56px;}
  h1{font-size:22px;font-weight:500;margin:0 0 6px;}
  p.sub{margin:0 0 8px;font-size:14px;color:#9FB0C8;}
  h2.sec{grid-column:1/-1;font-size:15px;font-weight:500;margin:20px 0 0;padding-top:14px;border-top:1px solid #243248;color:#CFE0F7;}
  h2.sec:first-child{border-top:none;margin-top:8px;padding-top:0;}
  h2.sec span{font-weight:400;color:#9FB0C8;font-size:13px;margin-left:8px;}
  #grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;}
  .card{background:#172236;border:1px solid #243248;border-radius:12px;padding:12px;}
  .card .t{font-size:14px;font-weight:500;margin-bottom:8px;}
  .card .c{font-size:13px;color:#9FB0C8;margin-top:6px;text-align:center;}
  .card .s{display:flex;justify-content:center;}
</style>
</head>
<body>
<main>
<h1>Star of Life loader master gallery</h1>
<p class="sub">Twenty looping animations on the original star path, in four series. The SVG loops run 3.6 seconds and the particle piece runs 9 seconds; each ends with a still pause. Cards pause while scrolled off screen.</p>
<div id="grid"></div>
</main>

<svg width="0" height="0" style="position:absolute"><defs id="defs"><path id="star" fill-rule="evenodd" d="M586.92 750.19C560.64 750.19 534.36 750.19 508.08 750.19C492.89 747.77 497 732.14 497 720.5C497 701.83 497 683.17 497 664.5C497 655.01 498.35 644.24 496.5 635C466.17 652.67 435.83 670.33 405.5 688C402.43 686.54 398.96 687 395.5 687C387.56 679.06 383.75 668.07 377.84 658.66C368.57 643.87 360.3 628.33 351 613.5C352.46 610.43 352 606.96 352 603.5C360.5 595 372.39 590.99 382.28 584.78C382.95 584.36 383.05 583.64 383.72 583.22C392.68 577.6 402.59 572.84 411.66 567.16C413.75 565.84 416.25 565.16 418.34 563.84C426.96 558.44 435.88 553.06 445 548.5C443.9 544.81 442.1 545.44 439.03 543.47C432.46 539.25 425.28 536 418.66 531.84C409.56 526.14 399.76 521.55 390.66 515.84C385.18 512.41 379.76 508.5 373.97 505.53C366.33 501.62 358.24 497.74 352 491.5C351.67 488.17 351.33 484.83 351 481.5C361.77 464.33 371.03 446.58 381.84 429.34C385.17 424.04 390.27 410.9 395.69 408.19C404.75 403.66 416.22 413.18 423.66 417.84C430.31 422.02 437.69 424.99 444.34 429.16C461.61 439.99 479.26 449.19 496.5 460C498.23 451.37 497 441.36 497 432.5C497 415.17 497 397.83 497 380.5C497 373.49 495.38 355.52 498.53 350.03C502.64 342.87 513.7 345 520.5 345C539.17 345 557.83 345 576.5 345C583.25 345 593.12 343.31 596.81 350.69C599.58 356.22 598 373.6 598 380.5C598 397.83 598 415.17 598 432.5C598 441.36 596.77 451.37 598.5 460C615.74 449.19 633.39 439.99 650.66 429.16C657.31 424.99 664.69 422.02 671.34 417.84C678.78 413.18 690.25 403.66 699.31 408.19C704.73 410.9 709.83 424.04 713.16 429.34C723.94 446.53 733.29 464.42 744 481.5C743.67 484.83 743.33 488.17 743 491.5C738.56 495.94 733.48 498.74 728.03 501.53C726.39 502.37 724.92 503.85 723.34 504.84C718.79 507.7 713.7 510.14 709.03 512.53C705.09 514.55 701.13 517.47 697.34 519.84C691.32 523.62 684.68 526.38 678.66 530.16C669.39 535.97 659.82 541.59 650 546.5C651.1 550.19 652.9 549.56 655.97 551.53C661.97 555.38 668.26 558.34 674.34 562.16C686.32 569.67 699.41 575.78 711.28 583.22C711.95 583.64 712.05 584.36 712.72 584.78C722.76 591.08 734.43 594.93 743 603.5C743.33 606.83 743.67 610.17 744 613.5C734.7 628.32 726.5 643.76 717.16 658.66C711.23 668.11 707.49 679.01 699.5 687C696.04 687 692.57 686.54 689.5 688C659.17 670.33 628.83 652.67 598.5 635C596.65 644.24 598 655.01 598 664.5C598 683.17 598 701.83 598 720.5C598 732.14 602.11 747.77 586.92 750.19Z"/>
<radialGradient id="flashG"><stop offset="0" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="bgG" cx="0.5" cy="0.45" r="0.75"><stop offset="0" stop-color="#3A7DDC"/><stop offset="1" stop-color="#2859B0"/></radialGradient>
<filter id="blurG" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter></defs></svg>
<svg width="0" height="0" style="position:absolute"><path id="hit" fill-rule="evenodd" opacity="0"/></svg>

<script>
const NS="http://www.w3.org/2000/svg",CX=547.5,CY=547.5,P=3600,RAD=Math.PI/180;
const grid=document.getElementById("grid"),defs=document.getElementById("defs");
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(p,a,b)=>clamp((p-a)/(b-a));
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eO=x=>1-Math.pow(1-x,3);
const eI=x=>x*x*x;
const eOB=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const rgb=(r,g,b)=>"rgb("+Math.round(r)+","+Math.round(g)+","+Math.round(b)+")";
function mk(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n;}
function pt(r,a){return[CX+r*Math.sin(a*RAD),CY-r*Math.cos(a*RAD)];}
function sector(a1,a2){const n=Math.ceil((a2-a1)/5-1e-6),o=[];for(let k=0;k<=n;k++){const q=pt(700,a1+(a2-a1)*k/n);o.push(q[0].toFixed(1)+","+q[1].toFixed(1));}o.push(CX+","+CY);return o.join(" ");}
function addClip(id,points){const cp=mk("clipPath",{id:id},defs);mk("polygon",{points:points},cp);}
function piece(parent,id){const o=mk("g",{},parent);const i=mk("g",{"clip-path":"url(#"+id+")"},o);mk("use",{href:"#star",fill:"#fff"},i);return o;}
function armSet(parent){const a=[];for(let i=0;i<6;i++)a.push(piece(parent,"arm"+i));return a;}
function armBody(parent){const pg=mk("g",{},parent),arms=armSet(pg),solid=mk("use",{href:"#star",fill:"#fff"},parent);return{pg:pg,arms:arms,solid:solid};}
const show=(el,on)=>el.setAttribute("display",on?"inline":"none");
function filt(id,t,a){
  const f=mk("filter",{id:id,x:"-40%",y:"-40%",width:"180%",height:"190%"},defs);
  mk("feDropShadow",{dx:0,dy:t[0],stdDeviation:t[1],"flood-color":"#071E47","flood-opacity":t[2]},f);
  return mk("feDropShadow",{dx:0,dy:a[0],stdDeviation:a[1],"flood-color":"#071E47","flood-opacity":a[2]},f);
}
filt("sh",[4,3,.4],[14,13,.4]);filt("shSm",[2,2,.35],[7,6,.35]);const sh1=filt("sh1",[4,3,.4],[14,13,.4]);

let curCard=null;
const list=[];
const ups={push(fn){list.push({fn:fn,c:curCard});}};
const io=new IntersectionObserver(es=>es.forEach(e=>{e.target._st.vis=e.isIntersecting;}),{rootMargin:"80px"});
let cardNo=0;
function section(title,note){const h=document.createElement("h2");h.className="sec";h.innerHTML=title+(note?"<span>"+note+"</span>":"");grid.appendChild(h);}
function card(title,cap){
  cardNo++;
  const c=document.createElement("div");c.className="card";
  c.innerHTML='<div class="t">'+cardNo+". "+title+'</div><div class="s"></div><div class="c">'+cap+'</div>';
  grid.appendChild(c);
  curCard={vis:true};c._st=curCard;io.observe(c);
  const svg=mk("svg",{viewBox:"227 227 640 640",role:"img",style:"width:100%;max-width:240px;height:auto;"});
  c.children[1].appendChild(svg);
  mk("rect",{x:227,y:227,width:640,height:640,rx:36,fill:"url(#bgG)"},svg);
  return mk("g",{},svg);
}
function layers(g){return{glow:mk("g",{},g),pl:mk("g",{filter:"url(#shSm)"},g),gh:mk("g",{filter:"url(#blurG)"},g),body:mk("g",{filter:"url(#sh)"},g)};}
function flash(layer,t,life,peak,R){
  const c=mk("circle",{cx:CX,cy:CY,r:R,fill:"url(#flashG)",opacity:0},layer);
  return p=>{const u=seg(p,t,t+life);if(u>0&&u<1){c.setAttribute("opacity",(peak*Math.sin(Math.PI*u)).toFixed(3));c.setAttribute("r",(R*(.6+.4*eO(u))).toFixed(1));}else c.setAttribute("opacity",0);};
}
for(let i=0;i<6;i++)addClip("arm"+i,sector(i*60-30,i*60+30));
const hp=document.getElementById("hit");hp.setAttribute("d",document.getElementById("star").getAttribute("d"));
let nativeHit=false;try{nativeHit=hp.isPointInFill(new DOMPoint(CX,CY));}catch(e){nativeHit=false;}
function inside(x,y){
  if(nativeHit)return hp.isPointInFill(new DOMPoint(x,y));
  for(const r of[0,60,120]){const t=-r*RAD,dx=x-CX,dy=y-CY;const rx=dx*Math.cos(t)-dy*Math.sin(t),ry=dx*Math.sin(t)+dy*Math.cos(t);if(Math.abs(rx)<50&&Math.abs(ry)<202)return true;}
  return false;
}
function randInStar(s){for(let k=0;k<30;k++){const x=CX-205+410*rnd(s+k*3+1),y=345+405*rnd(s+k*3+2);if(inside(x,y))return{x:x,y:y};}return{x:CX,y:CY};}
const VP=[];
for(let k=0;k<6;k++){
  const a=k*60,t=a*RAD;
  [[-50.5,-202.5],[50.5,-202.5]].forEach(v=>VP.push([v[0]*Math.cos(t)-v[1]*Math.sin(t),v[0]*Math.sin(t)+v[1]*Math.cos(t)]));
  const t2=(a+30)*RAD;VP.push([101*Math.sin(t2),-101*Math.cos(t2)]);
}
const OUT=["sq","chip","tri","dia","hex","dot"];
const T_ALL=["bar","sq","chip","tri","dia","line","hex","dot"];
const T_FAST=["bar","line","sq","chip"];
const T_HEAVY=["chip","tri","dia","hex","sq"];
function shape(type,parent,outline){
  const f=outline?{fill:"none",stroke:"#fff","stroke-width":2,"vector-effect":"non-scaling-stroke"}:{fill:"#fff"};
  if(type==="bar")return mk("rect",Object.assign({x:-13,y:-4,width:26,height:8},f),parent);
  if(type==="sq")return mk("rect",Object.assign({x:-6,y:-6,width:12,height:12},f),parent);
  if(type==="chip")return mk("rect",Object.assign({x:-10,y:-6,width:20,height:12},f),parent);
  if(type==="line")return mk("rect",{x:-16,y:-2,width:32,height:4,fill:"#fff"},parent);
  if(type==="tri")return mk("polygon",Object.assign({points:"0,-9 9,7 -9,7"},f),parent);
  if(type==="hex")return mk("polygon",Object.assign({points:"8,0 4,6.9 -4,6.9 -8,0 -4,-6.9 4,-6.9"},f),parent);
  if(type==="dot")return mk("circle",Object.assign({r:5},f),parent);
  return mk("polygon",Object.assign({points:"0,-10 7,0 0,10 -7,0"},f),parent);
}
function burst(layer,o){
  const ps=[];
  for(let i=0;i<o.n;i++){
    const s=(o.seed||0)+i*7+1;
    const tp=o.types[Math.floor(rnd(s)*o.types.length)];
    const sc=o.sc[0]+(o.sc[1]-o.sc[0])*rnd(s+7);
    const ol=OUT.indexOf(tp)>=0&&sc>.9&&rnd(s+2)>.55;
    const g=mk("g",{opacity:0},layer);shape(tp,g,ol);
    const org=o.origin(i,s);
    ps.push({g:g,sc:sc,org:org,skip:!!org.skip,dist:o.dist[0]+(o.dist[1]-o.dist[0])*rnd(s+4),rot0:o.fixedRot?0:rnd(s+5)*180,spin:o.fixedRot?0:(rnd(s+6)-.5)*240,delay:o.delay?o.delay(i,s):0,vis:false});
  }
  return function(p){
    for(const q of ps){
      if(q.skip)continue;
      const t0=o.t+q.delay,u=seg(p,t0,t0+o.life);
      if(u<=0||u>=1){if(q.vis){q.g.setAttribute("opacity",0);q.vis=false;}continue;}
      const inw=o.mode==="in",d=q.dist*(inw?1-u*u*u:eO(u)),a=q.org.a*RAD;
      const x=q.org.x+d*Math.sin(a),y=q.org.y-d*Math.cos(a)+(o.g||0)*u*u;
      const op=inw?.9*Math.min(seg(u,0,.2),1-seg(u,.8,1)):.9*(1-seg(u,.45,1));
      q.g.setAttribute("transform","translate("+x.toFixed(1)+" "+y.toFixed(1)+") rotate("+(q.rot0+q.spin*eO(u)).toFixed(1)+") scale("+(q.sc*(1-.3*u)).toFixed(3)+")");
      q.g.setAttribute("opacity",op.toFixed(3));q.vis=true;
    }
  };
}
function ringOrigin(n,rMin,rMax,jit){return(i,s)=>{const a=i/n*360+(rnd(s)-.5)*jit,r=rMin+rnd(s+3)*(rMax-rMin),q=pt(r,a);return{x:q[0],y:q[1],a:a};};}

/* ===== Series 1: Kinetic and particle ===== */
section("Kinetic and particle","Arms, bursts, and mechanical motion");

const g1=card("Spin scatter","Shadow lifts away as the arms scatter");
const L1=layers(g1);L1.body.setAttribute("filter","url(#sh1)");
const gh1=[{g:mk("g",{opacity:0},L1.gh),lag:2,op:.12},{g:mk("g",{opacity:0},L1.gh),lag:1,op:.25}];
gh1.forEach(l=>{l.arms=armSet(l.g);});
const main1=mk("g",{},L1.body),B1=armBody(main1);
const ang1=p=>720*eIO(seg(p,.05,.5));
const bell1=p=>p<.275?eO(seg(p,.0725,.23)):1-eIO(seg(p,.275,.5));
const off=(arms,d)=>arms.forEach((g,i)=>{const t=i*60*RAD;g.setAttribute("transform","translate("+(Math.sin(t)*d).toFixed(1)+" "+(-Math.cos(t)*d).toFixed(1)+")");});
ups.push(flash(L1.glow,.5,.18,.18,260));
ups.push(burst(L1.pl,{t:.5,life:.13,n:20,seed:10,types:T_ALL,sc:[.4,1.6],dist:[55,140],mode:"out",origin:ringOrigin(20,130,180,18)}));
ups.push(p=>{
  const a=ang1(p),sp=clamp((a-ang1(p-.012))/.012/4800),d=85*bell1(p);
  gh1.forEach(l=>{l.g.setAttribute("transform","rotate("+(a-l.lag*10*sp).toFixed(2)+" "+CX+" "+CY+")");l.g.setAttribute("opacity",(l.op*Math.min(1,sp*1.6)).toFixed(3));off(l.arms,d);});
  const k=1+.03*Math.sin(Math.PI*seg(p,.5,.55));
  main1.setAttribute("transform","translate("+CX+" "+CY+") scale("+k.toFixed(4)+") rotate("+a.toFixed(2)+") translate("+(-CX)+" "+(-CY)+")");
  off(B1.arms,d);const asm=d<.0005;show(B1.solid,asm);show(B1.pg,!asm);
  sh1.setAttribute("dy",(14+d*.15).toFixed(1));sh1.setAttribute("stdDeviation",(13+d*.1).toFixed(1));
});

const g2=card("Close and open","Debris is sucked in, then blown out with a soft flash");
const L2=layers(g2),B2=armBody(L2.body);
ups.push(flash(L2.glow,.52,.2,.16,250));
ups.push(burst(L2.pl,{t:.1,life:.3,n:18,seed:200,types:T_ALL,sc:[.4,1.6],dist:[150,270],mode:"in",origin:(i,s)=>({x:CX,y:CY,a:i/18*360+(rnd(s)-.5)*18})}));
ups.push(burst(L2.pl,{t:.52,life:.14,n:20,seed:300,types:T_ALL,sc:[.4,1.6],dist:[90,200],mode:"out",origin:ringOrigin(20,90,130,18)}));
ups.push(p=>{
  const tw=p<.5?-28*eIO(seg(p,.08,.4)):-28*(1-eIO(seg(p,.52,.84)));
  let dev=0;
  B2.arms.forEach((g,i)=>{
    const dl=i*.018,a=i*60;
    let k=p<.5?1-.72*eIO(seg(p,.08+dl,.36+dl)):.28+.72*eOB(seg(p,.52+dl,.8+dl));
    k+=.035*Math.sin(Math.PI*4*seg(p,.38,.54));
    dev=Math.max(dev,Math.abs(k-1));
    g.setAttribute("transform","rotate("+tw.toFixed(2)+" "+CX+" "+CY+") translate("+CX+" "+CY+") rotate("+a+") scale(1 "+k.toFixed(4)+") rotate("+(-a)+") translate("+(-CX)+" "+(-CY)+")");
  });
  const asm=dev<.0005&&Math.abs(tw)<.01;show(B2.solid,asm);show(B2.pg,!asm);
});

const g3=card("Orbit and lock","Faint tracks, shed trail, and a spark at each lock");
const L3=layers(g3);
const trk=[mk("circle",{cx:CX,cy:CY,r:175,fill:"none",stroke:"#fff","stroke-width":4,opacity:0},L3.glow),mk("circle",{cx:CX,cy:CY,r:215,fill:"none",stroke:"#fff","stroke-width":4,opacity:0},L3.glow)];
const B3=armBody(L3.body);
const base3=i=>70+(i%2)*40;
const det3=(i,p)=>eO(seg(p,.04+i*.015,.15+i*.015));
const lock3=(i,p)=>{const L=.52+i*.05;return eOB(seg(p,L,L+.1));};
const r3=(i,p)=>base3(i)*det3(i,p)*(1-lock3(i,p));
const a3=(i,p)=>(i%2?1:-1)*360*eIO(seg(p,.16,.5));
ups.push(flash(L3.glow,.78,.16,.12,240));
ups.push(burst(L3.pl,{t:0,life:.07,n:90,seed:400,types:["sq","bar","line","chip"],sc:[.35,1.2],dist:[20,45],mode:"out",
  delay:i=>.2+Math.floor(i/6)*.02,
  origin:(i,s)=>{const arm=i%6,tb=.2+Math.floor(i/6)*.02,r=r3(arm,tb),q=pt(185+r,arm*60),th=a3(arm,tb)*RAD,dx=q[0]-CX,dy=q[1]-CY;
    return{x:CX+dx*Math.cos(th)-dy*Math.sin(th),y:CY+dx*Math.sin(th)+dy*Math.cos(th),a:arm*60+a3(arm,tb)+(rnd(s)-.5)*60};}}));
for(let i=0;i<6;i++){
  ups.push(burst(L3.pl,{t:.52+i*.05+.05,life:.1,n:5,seed:500+i*10,types:T_ALL,sc:[.4,1.6],dist:[25,85],mode:"out",
    origin:(k,s)=>{const q=pt(175,i*60);return{x:q[0],y:q[1],a:i*60+(rnd(s)-.5)*110};}}));
}
ups.push(p=>{
  let dmax=0,asm=true;
  B3.arms.forEach((g,i)=>{
    const r=r3(i,p),a=i*60*RAD;
    g.setAttribute("transform","rotate("+a3(i,p).toFixed(2)+" "+CX+" "+CY+") translate("+(Math.sin(a)*r).toFixed(1)+" "+(-Math.cos(a)*r).toFixed(1)+")");
    dmax=Math.max(dmax,det3(i,p));if(Math.abs(r)>.0005)asm=false;
  });
  const o=(.22*dmax*(1-seg(p,.48,.62))).toFixed(3);trk.forEach(t=>t.setAttribute("opacity",o));
  show(B3.solid,asm);show(B3.pg,!asm);
});

const g4=card("Collapse and burst","Implosion, a soft flash, shrapnel and falling chunks");
const L4=layers(g4);
const rings=[mk("circle",{cx:CX,cy:CY,r:20,fill:"none",stroke:"#fff","stroke-width":14,opacity:0},L4.glow),mk("circle",{cx:CX,cy:CY,r:20,fill:"none",stroke:"#fff","stroke-width":7,opacity:0},L4.glow)];
const b4=mk("g",{},L4.body);mk("use",{href:"#star",fill:"#fff"},b4);
ups.push(flash(L4.glow,.38,.22,.26,300));
ups.push(burst(L4.pl,{t:.14,life:.26,n:22,seed:600,types:T_ALL,sc:[.4,1.6],dist:[160,300],mode:"in",origin:(i,s)=>({x:CX,y:CY,a:i/22*360+(rnd(s)-.5)*16})}));
ups.push(burst(L4.pl,{t:.4,life:.12,n:16,seed:700,types:T_FAST,sc:[.3,.9],dist:[160,300],mode:"out",origin:ringOrigin(16,20,50,20)}));
ups.push(burst(L4.pl,{t:.4,life:.2,n:9,seed:800,types:T_HEAVY,sc:[1,1.7],dist:[80,170],g:50,mode:"out",origin:ringOrigin(9,20,50,30)}));
ups.push(p=>{
  let s;
  if(p<.06)s=1;else if(p<.12)s=1+.08*eO(seg(p,.06,.12));else if(p<.4)s=1.08-1.05*eI(seg(p,.12,.36));else s=.03+.97*eOB(seg(p,.4,.66));
  b4.setAttribute("transform","translate("+CX+" "+CY+") rotate("+(-180*eIO(seg(p,.12,.66))).toFixed(2)+") scale("+s.toFixed(4)+") translate("+(-CX)+" "+(-CY)+")");
  const u1=seg(p,.4,.72),u2=seg(p,.46,.78);
  rings[0].setAttribute("r",(24+290*eO(u1)).toFixed(1));rings[0].setAttribute("opacity",(u1>0&&u1<1)?(.85*(1-u1)).toFixed(3):0);
  rings[1].setAttribute("r",(24+230*eO(u2)).toFixed(1));rings[1].setAttribute("opacity",(u2>0&&u2<1)?(.6*(1-u2)).toFixed(3):0);
});

const g5=card("Ratchet index","Click sparks, and a soft pulse when the ring completes");

/* ===== Series 4: Particle ===== */
section("Particle","A canvas animation with thousands of glowing particles");
(function(){
  const QP=1.25,TAU=Math.PI*2,lerp=(a,b,t)=>a+(b-a)*t;
  const starPath=new Path2D();starPath.addPath(new Path2D(document.getElementById("star").getAttribute("d")),new DOMMatrix([1,0,0,1,-CX,-CY]));
  cardNo++;
  const c=document.createElement("div");c.className="card";
  c.innerHTML='<div class="t">'+cardNo+'. Particle genesis</div><div class="s"></div><div class="c">4,000 glowing particles: star, spiral galaxy, counter-rotating rings, then a collapse back</div>';
  grid.appendChild(c);
  curCard={vis:true};c._st=curCard;io.observe(c);
  const cv=document.createElement("canvas");cv.width=640*QP;cv.height=640*QP;
  cv.style.cssText="width:100%;max-width:240px;height:auto;border-radius:14px;display:block;";
  c.children[1].appendChild(cv);
  const ctx=cv.getContext("2d");
  const sp=new Path2D();sp.addPath(new Path2D(document.getElementById("star").getAttribute("d")),new DOMMatrix([QP,0,0,QP,QP*(320-CX),QP*(320-CY)]));
  ctx.setTransform(1,0,0,1,0,0);
  const MAXN=4200,S={tx:new Float32Array(MAXN),ty:new Float32Array(MAXN),gr:new Float32Array(MAXN),ga:new Float32Array(MAXN),rr:new Float32Array(MAXN),ra:new Float32Array(MAXN),rd:new Float32Array(MAXN),ph:new Float32Array(MAXN),sz:new Float32Array(MAXN),tint:new Uint8Array(MAXN),px:new Float32Array(MAXN),py:new Float32Array(MAXN),first:true};
  let n=0,tries=0;
  while(n<MAXN&&tries<70000){tries++;const x=(rnd(tries*2+1)-.5)*424,y=(rnd(tries*2+2)-.5)*424;if(ctx.isPointInPath(sp,QP*(x+320),QP*(y+320))){S.tx[n]=x;S.ty[n]=y;n++;}}
  S.N=n;
  for(let i=0;i<n;i++){
    const gr=30+Math.pow(rnd(i+9),.6)*290;S.gr[i]=gr;S.ga[i]=(i%3)*2.094+gr*.016+(rnd(i+19)-.5)*.5;
    const band=i%3;S.rr[i]=220+band*30+(rnd(i+29)-.5)*10;S.ra[i]=rnd(i+39)*TAU;S.rd[i]=band%2?1:-1;
    S.ph[i]=rnd(i+49);S.sz[i]=1.6+rnd(i+59)*1.6;S.tint[i]=rnd(i+69)>.72?1:0;
  }
  const PMS=9000,Tstart=performance.now();
  list.push({c:curCard,fn:function(){
    const t=((performance.now()-Tstart)%PMS)/PMS;
    ctx.setTransform(QP,0,0,QP,0,0);ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1;
    if(S.first){const g=ctx.createRadialGradient(320,288,0,320,288,470);g.addColorStop(0,"#3A7DDC");g.addColorStop(1,"#2859B0");ctx.fillStyle=g;ctx.fillRect(0,0,640,640);S.first=false;}
    ctx.fillStyle="rgba(41,94,185,0.22)";ctx.fillRect(0,0,640,640);
    const fa=t<.5?1-seg(t,.1,.16):seg(t,.84,.92);
    if(fa>.001){ctx.save();ctx.translate(320,320);ctx.globalAlpha=fa;ctx.shadowColor="rgba(7,30,71,.5)";ctx.shadowBlur=26*QP;ctx.shadowOffsetY=12*QP;ctx.fillStyle="#fff";ctx.fill(starPath);ctx.restore();}
    const pa=seg(t,.1,.16)*(1-seg(t,.86,.94));
    if(pa<=.001)return;
    const a1=eIO(seg(t,.12,.32)),a2=eIO(seg(t,.38,.58)),a3=eIO(seg(t,.64,.84));
    const amp=14*(Math.sin(Math.PI*a1)+Math.sin(Math.PI*a2)+Math.sin(Math.PI*a3)),rotC=8*a3*(1-a3),cs=Math.cos(rotC),sn=Math.sin(rotC);
    for(let i=0;i<S.N;i++){
      const gr=S.gr[i],ga=S.ga[i]+t*TAU*1.4/(1+gr/110),gx=gr*Math.cos(ga),gy=gr*Math.sin(ga);
      const ra=S.ra[i]+S.rd[i]*t*TAU*1.2,rx=S.rr[i]*Math.cos(ra),ry=S.rr[i]*Math.sin(ra);
      let x=lerp(S.tx[i],gx,a1),y=lerp(S.ty[i],gy,a1);
      x=lerp(x,rx,a2);y=lerp(y,ry,a2);
      x=lerp(x,S.tx[i],a3);y=lerp(y,S.ty[i],a3);
      const xr=x*cs-y*sn,yr=x*sn+y*cs;x=xr;y=yr;
      x+=amp*Math.sin(t*14+S.ph[i]*TAU+y*.015);y+=amp*Math.cos(t*13+S.ph[i]*TAU+x*.015);
      S.px[i]=x;S.py[i]=y;
    }
    ctx.save();ctx.translate(320,320);ctx.globalCompositeOperation="lighter";
    const rg=seg(t,.38,.5)*(1-seg(t,.7,.8));
    if(rg>.01){ctx.globalAlpha=.16*rg;ctx.strokeStyle="#fff";ctx.lineWidth=1.5;[220,250,280].forEach(r=>{ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.stroke();});}
    for(let k=0;k<2;k++){
      ctx.fillStyle=k?"#AEEBFF":"#fff";ctx.globalAlpha=.8*pa;
      for(let i=0;i<S.N;i++){if(S.tint[i]!==k)continue;const s=S.sz[i];ctx.fillRect(S.px[i]-s/2,S.py[i]-s/2,s,s);}
    }
    const fl=seg(t,.84,.92);
    if(fl>0&&fl<1){const g=ctx.createRadialGradient(0,0,0,0,0,260);g.addColorStop(0,"rgba(255,255,255,.55)");g.addColorStop(1,"rgba(255,255,255,0)");ctx.globalAlpha=Math.sin(Math.PI*fl);ctx.fillStyle=g;ctx.fillRect(-300,-300,600,600);}
    ctx.restore();
  }});
})();

const t0=performance.now();
function frame(now){
  const p=((now-t0)%P)/P;
  for(const e of list){if(e.c.vis)e.fn(p);}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
