<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Available Roles · Medrunner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Mohave:wght@500;600;700&family=Oxanium:wght@500;600;700&family=Quantico:wght@700&display=swap" rel="stylesheet">
<style>

:root{--pisces:url(media/img/pisces.webp);--team:url(media/img/team.webp);--fire:url(media/img/fire.webp);--hero:url(media/img/hero.webp);--j1:url(media/img/j1.webp);--lineup:url(media/img/lineup.webp);--red:#ef4444;--red-hi:#ff8b8b;--bg:#0b0f17;--fg:#f3f4f6;--mut:#cbd5e1;--fh:'Mohave',sans-serif;--fl:'Oxanium',sans-serif;--fb:'Inter',system-ui,sans-serif;--fq:'Quantico',sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:radial-gradient(70% 50% at 50% 0%,rgba(239,68,68,.12),transparent 70%),var(--bg);color:var(--fg);font-family:var(--fb);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit}
.wrap{width:min(1200px,100% - 32px);margin:0 auto;padding:clamp(36px,6vw,72px) 0 64px}
.hd{text-align:center;margin-bottom:22px}
.ey{display:inline-flex;align-items:center;gap:8px;margin:0 0 12px;font:600 12px var(--fl);letter-spacing:.22em;text-transform:uppercase;color:var(--red-hi)}
.ey::before,.ey::after{content:"";width:22px;height:1px;background:currentColor;opacity:.6}
h1{margin:0;font:700 clamp(40px,6vw,64px)/1 var(--fh);text-transform:uppercase;letter-spacing:.02em;text-shadow:0 0 22px rgba(255,120,120,.35)}
.sub{margin:14px auto 0;max-width:36rem;font-size:16px;line-height:1.55;color:var(--mut)}
.vsw{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:0 auto 26px;padding:5px;width:max-content;max-width:100%;border-radius:14px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.vsw button{display:flex;align-items:center;gap:8px;padding:8px 14px;border:0;border-radius:10px;background:transparent;font:600 12px var(--fl);letter-spacing:.12em;text-transform:uppercase;color:#94a3b8;cursor:pointer;transition:background .25s,color .25s}
.vsw button b{font:700 10px var(--fl);padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.08);color:#cbd5e1}
.vsw button[aria-pressed=true]{background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 0 18px rgba(239,68,68,.45)}
.vsw button[aria-pressed=true] b{background:rgba(0,0,0,.25);color:#fff}
.vsw button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.view{display:none}
.view.on{display:block;animation:vin .5s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
.ic{width:18px;height:18px;fill:currentColor;flex:none}
.cta{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;padding:13px 22px;border-radius:12px;background:linear-gradient(180deg,#fff,#ffe1e1);color:#991b1b;font:700 14px var(--fq);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;box-shadow:0 0 0 1px rgba(255,255,255,.6),0 0 26px rgba(255,120,120,.45),0 8px 20px rgba(80,0,0,.45);transition:transform .2s,box-shadow .2s}
.cta svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 0 0 1px #fff,0 0 40px rgba(255,140,140,.7),0 12px 26px rgba(80,0,0,.5)}
.cta:hover svg{transform:translateX(3px)}
.cta:focus-visible{outline:2px solid #fff;outline-offset:3px}
.code{display:inline-flex;align-items:center;gap:7px;padding:4px 9px 4px 7px;border-radius:7px;background:rgba(239,68,68,.16);box-shadow:inset 0 0 0 1px rgba(255,140,140,.45);font:700 11px var(--fl);letter-spacing:.16em;color:#fecaca}
.code .ic{width:13px;height:13px}
.love{margin:14px 0 0;padding:10px 14px;border-left:2px solid var(--red);background:linear-gradient(90deg,rgba(239,68,68,.14),transparent);font-size:14px;line-height:1.5;color:#fde2e2}
.love b{font:700 11px var(--fl);letter-spacing:.14em;text-transform:uppercase;color:var(--red-hi);display:block;margin-bottom:2px}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px;margin-top:30px;font:600 12px var(--fl);letter-spacing:.12em;text-transform:uppercase;color:#94a3b8}
.facts span{display:flex;align-items:center;gap:8px}
.facts span::before{content:"";width:6px;height:6px;rotate:45deg;background:var(--red);box-shadow:0 0 8px var(--red)}


.sq-row{display:flex;height:clamp(540px,66vh,660px);padding-left:30px}
.sq-p{--cut:46px;position:relative;flex:1 1 0;min-width:0;margin-left:-30px;cursor:pointer;clip-path:polygon(var(--cut) 0,100% 0,calc(100% - var(--cut)) 100%,0 100%);transition:flex-grow .75s var(--ease);background:#05070b;border:0;padding:0;text-align:left;outline:0}
.sq-p.on{flex-grow:4.2;cursor:default}
.sq-img{position:absolute;inset:0;background:var(--img) var(--pos,center)/cover no-repeat;filter:grayscale(.85) brightness(.45);transform:scale(1.08);transition:filter .7s,transform 1.2s var(--ease)}
.sq-p:hover .sq-img{filter:grayscale(.4) brightness(.6)}
.sq-p.on .sq-img{filter:none;transform:scale(1)}
.sq-p::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(0,0,0,.9),rgba(0,0,0,.15) 55%,rgba(0,0,0,.35)),linear-gradient(90deg,rgba(0,0,0,.6),transparent 70%);opacity:.75;transition:opacity .6s}
.sq-p.on::before{opacity:1}
.sq-p::after{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:45%;z-index:4;background:linear-gradient(90deg,transparent,rgba(239,68,68,.75) 40%,rgba(255,200,200,.9) 50%,rgba(239,68,68,.75) 60%,transparent);transform:translateX(-120%) skewX(-18deg);pointer-events:none;opacity:0}
.sq-p.flash::after{animation:slash .8s cubic-bezier(.5,0,.3,1)}
@keyframes slash{0%{opacity:1;transform:translateX(-120%) skewX(-18deg)}100%{opacity:1;transform:translateX(320%) skewX(-18deg)}}
.sq-edge{position:absolute;inset:0;z-index:3;pointer-events:none;clip-path:inherit;box-shadow:inset 0 3px 0 transparent;transition:box-shadow .5s}
.sq-p.on .sq-edge{box-shadow:inset 0 3px 0 var(--red)}
.sq-p:focus-visible .sq-edge{box-shadow:inset 0 0 0 2px #fff}
.sq-lbl{position:absolute;z-index:2;left:50%;bottom:28px;translate:-50% 0;display:flex;flex-direction:column;align-items:center;gap:12px;transition:opacity .35s,transform .5s var(--ease)}
.sq-lbl .ic{width:22px;height:22px;color:var(--red-hi);filter:drop-shadow(0 0 8px rgba(239,68,68,.7))}
.sq-lbl b{writing-mode:vertical-rl;rotate:180deg;font:700 clamp(22px,2.6vw,32px)/1 var(--fh);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 18px #000}
.sq-lbl em{font:700 11px var(--fl);font-style:normal;letter-spacing:.2em;color:#fecaca;opacity:.8}
.sq-p.on .sq-lbl{opacity:0;transform:translateY(20px);pointer-events:none}
.sq-info{position:absolute;z-index:2;left:calc(var(--cut) + 24px);right:calc(var(--cut) + 24px);bottom:30px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(200px,.75fr);gap:12px 34px;align-items:end;pointer-events:none}
.sq-p.on .sq-info{pointer-events:auto}
.sq-info>*{opacity:0;transform:translateY(16px);transition:opacity .35s,transform .35s}
.sq-p.on .sq-info>*{opacity:1;transform:none;transition:opacity .6s var(--d,0s),transform .7s var(--ease) var(--d,0s)}
.sq-info h2{margin:10px 0 0;font:700 clamp(44px,5.6vw,72px)/.9 var(--fh);text-transform:uppercase;letter-spacing:.02em;text-shadow:0 0 30px #000}
.sq-tag{margin:6px 0 0;font:600 clamp(16px,1.7vw,21px)/1.25 var(--fh);letter-spacing:.08em;text-transform:uppercase;color:#fecaca}
.sq-d{margin:12px 0 0;font-size:15px;line-height:1.6;color:#e5e7eb;text-shadow:0 0 14px #000;max-width:34rem}
.sq-side{display:grid;gap:16px;align-content:end}
.sq-side h3,.mr-h3{margin:0 0 8px;font:700 11px var(--fl);letter-spacing:.2em;text-transform:uppercase;color:var(--red-hi)}
.sq-perks{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.sq-perks li{padding:5px 10px;border-radius:999px;background:rgba(10,4,6,.6);box-shadow:inset 0 0 0 1px rgba(255,160,160,.35);font:600 11px var(--fl);letter-spacing:.08em;text-transform:uppercase;color:#fee2e2}
.sq-foot{grid-column:1/-1;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.sq-foot .love{margin:0;flex:1 1 280px}


.dk{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;align-items:center;min-height:600px}
.dk-stage{position:relative;height:600px;perspective:1400px;touch-action:pan-y;user-select:none}
.dk-c{position:absolute;left:50%;top:50%;width:min(320px,60vw);aspect-ratio:5/7.2;margin:0;padding:0;border:0;background:none;translate:-50% -50%;transform-style:preserve-3d;transition:transform .8s var(--ease),opacity .6s,filter .6s;cursor:pointer}
.dk-c.on{cursor:default}
.dk-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s var(--ease);transform:rotateY(calc(var(--flip,0) * 180deg + var(--ty,0deg))) rotateX(var(--tx,0deg))}
.dk-c.tilt .dk-in{transition:transform .12s linear}
.dk-f,.dk-b{position:absolute;inset:0;border-radius:20px;overflow:hidden;backface-visibility:hidden;box-shadow:0 0 0 1.5px rgba(255,220,220,.55),0 0 0 5px rgba(10,6,8,.9),0 0 0 6.5px rgba(239,68,68,.6),0 28px 60px rgba(0,0,0,.6)}
.dk-f{background:var(--img) var(--pos,center)/cover}
.dk-f::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,5,8,.95) 0%,rgba(5,5,8,.2) 45%,transparent 70%)}
.dk-foil{position:absolute;inset:0;mix-blend-mode:color-dodge;opacity:0;background:linear-gradient(115deg,transparent 25%,rgba(255,80,120,.5) 42%,rgba(255,220,160,.5) 50%,rgba(120,200,255,.45) 58%,transparent 75%) calc(50% + var(--gx,0) * 1%) 50%/250% 250%;transition:opacity .4s}
.dk-c.on .dk-foil{opacity:.28}
.dk-ft{position:absolute;left:18px;right:18px;bottom:18px;display:grid;gap:8px}
.dk-ft h3{margin:0;font:700 40px/.9 var(--fh);text-transform:uppercase;letter-spacing:.03em;text-shadow:0 0 20px #000}
.dk-ft .row{display:flex;justify-content:space-between;align-items:center}
.dk-ft .n{font:700 12px var(--fl);letter-spacing:.14em;color:#94a3b8}
.dk-b{transform:rotateY(180deg);padding:22px 20px;display:flex;flex-direction:column;gap:16px;background:radial-gradient(120% 80% at 50% 0%,rgba(239,68,68,.28),transparent 60%),#0d1018}
.dk-b h4{margin:0;font:700 26px var(--fh);text-transform:uppercase;letter-spacing:.05em}
.dk-b .pip{grid-template-columns:70px 1fr}
.dk-b ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.dk-b li{display:flex;gap:9px;font-size:13px;line-height:1.4;color:#e5e7eb}
.dk-b li::before{content:"";flex:none;width:6px;height:6px;margin-top:6px;rotate:45deg;background:var(--red)}
.dk-flip{position:absolute;z-index:3;top:14px;right:14px;display:flex;align-items:center;gap:6px;padding:6px 10px;border:0;border-radius:8px;background:rgba(0,0,0,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);font:700 10.5px var(--fl);letter-spacing:.14em;text-transform:uppercase;color:#fff;cursor:pointer;opacity:0;transition:opacity .3s;backface-visibility:hidden}
.dk-flip svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dk-c.on .dk-flip{opacity:1}
.dk-b .dk-flip{position:static;align-self:flex-start;opacity:1;margin-top:auto}
.dk-nav{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;align-items:center;gap:14px;z-index:20}
.dk-nav button{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);cursor:pointer;transition:background .2s}
.dk-nav button:hover{background:rgba(239,68,68,.3)}
.dk-nav button svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.dk-dots{display:flex;gap:8px}
.dk-dots i{width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);transition:background .3s,width .3s}
.dk-dots i.on{width:40px;background:var(--red);box-shadow:0 0 10px var(--red)}
.dk-info>*{transition:opacity .35s,transform .45s var(--ease)}
.dk-info.out>*{opacity:0;transform:translateY(12px)}
.dk-info h2{margin:12px 0 0;font:700 clamp(48px,6vw,80px)/.9 var(--fh);text-transform:uppercase}
.dk-info .sq-d{font-size:16px}
.dk-mo{margin:16px 0 0;font-size:14px;line-height:1.5;color:#cbd5e1}
.dk-mo b{display:block;margin-bottom:3px;font:700 11px var(--fl);letter-spacing:.16em;text-transform:uppercase;color:var(--red-hi)}
.dk-info .cta{margin-top:22px}
.dk-c:focus-visible .dk-f{outline:2px solid #fff;outline-offset:6px}


.ib{--dur:1.3s;--stage:60%;--n:4;position:relative;width:100%;min-height:clamp(30rem,62vh,46rem);border-radius:18px;overflow:hidden;background:#05070b;box-shadow:0 0 0 1px rgba(255,200,200,.22),0 0 60px rgba(239,68,68,.18),0 30px 80px rgba(0,0,0,.55);isolation:isolate}
.ib::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,0) 70%),linear-gradient(0deg,rgba(0,0,0,.55),transparent 45%);transition:opacity .7s ease-out}
.ib.anim::before{opacity:0;transition-delay:.7s}
.ib-bg{position:absolute;inset:0;z-index:0}
.ib-img{position:absolute;inset:0;background:var(--img) var(--pos,center)/cover no-repeat;opacity:0;transform:scale(1.04);transition:opacity .5s ease-in-out .7s,transform 6s cubic-bezier(.2,.7,.2,1) .7s}
.ib-img.on{opacity:1;transform:scale(1)}
.ib-tr{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none}
.ib-tr i{position:absolute;top:0;bottom:0;left:0;will-change:transform;transform:translateX(-200%)}
.ib-tr .full{background:var(--red);opacity:.5}
.ib-tr .bar{background:color-mix(in srgb,var(--red) 70%,#fff);opacity:.55}
.ib-stage{position:relative;z-index:3;width:var(--stage);min-height:inherit}
.ib-slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(20px,3vw,40px) clamp(20px,3vw,40px) clamp(28px,3.6vw,48px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease-in-out .8s,visibility 0s linear 1.3s}
.ib-slide.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .5s ease-in-out 1.1s,visibility 0s linear 1.1s}
.ib.first .ib-slide.on,.ib.first .ib-img.on{transition-delay:0s}
.ib-det{max-width:min(36rem,100%)}
.ib-num{display:flex;align-items:center;gap:10px;margin:0 0 10px;font:600 12px var(--fl);letter-spacing:.2em;text-transform:uppercase;color:var(--red-hi)}
.ib-num::after{content:"";width:40px;height:1px;background:currentColor;opacity:.7}
.ib-slide h2{margin:0;font:700 clamp(36px,5.2vw,64px)/.95 var(--fh);text-transform:uppercase;letter-spacing:.02em;text-shadow:0 0 30px #000}
.ib-tag{margin:8px 0 0;font:600 clamp(15px,1.6vw,19px)/1.3 var(--fh);letter-spacing:.08em;text-transform:uppercase;color:#fecaca;text-shadow:0 0 18px #000}
.ib-slide p.d{margin:12px 0 0;font-size:clamp(14px,1.25vw,16px);line-height:1.6;color:#e5e7eb;text-shadow:0 0 16px #000}
.ib-chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.ib-chips li{padding:5px 11px;border-radius:999px;background:rgba(10,4,6,.55);box-shadow:inset 0 0 0 1px rgba(255,160,160,.4);font:600 11px var(--fl);letter-spacing:.1em;text-transform:uppercase;color:#fee2e2;backdrop-filter:blur(4px)}
.ib-cta{white-space:nowrap;display:inline-flex;align-items:center;gap:10px;align-self:flex-start;margin-top:22px;padding:13px 22px;border-radius:12px;background:linear-gradient(180deg,#ffffff,#ffe1e1);color:#991b1b;font:700 14px var(--fq);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;box-shadow:0 0 0 1px rgba(255,255,255,.6),0 0 26px rgba(255,120,120,.45),0 8px 20px rgba(80,0,0,.45);transition:transform .2s,box-shadow .2s}
.ib-cta svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.ib-cta:hover{transform:translateY(-2px);box-shadow:0 0 0 1px #fff,0 0 40px rgba(255,140,140,.7),0 12px 26px rgba(80,0,0,.5)}
.ib-cta:hover svg{transform:translateX(3px)}
.ib-cta:focus-visible,.ib-tab:focus-visible{outline:2px solid #fff;outline-offset:3px}
.ib-tabs{position:absolute;top:0;bottom:0;right:0;z-index:3;width:calc(100% - var(--stage))}
.ib.anim .ib-tabs{pointer-events:none}
.ib-cell{position:absolute;top:0;bottom:0;width:calc(100% / var(--n))}
.ib-cell.ghost{pointer-events:none}
.ib-tab{position:relative;display:flex;width:100%;height:100%;padding:0 10px 0 0;margin:0;border:0;background:transparent;color:inherit;cursor:pointer;overflow:hidden;text-align:left;font:inherit}
.ib-hov{position:absolute;inset:0;opacity:0;pointer-events:none;background:linear-gradient(to bottom,rgba(239,68,68,0),var(--red) 50% 100%);transform:scaleY(0);transform-origin:center bottom;transition:opacity .2s ease-out,transform .6s ease-out}
.ib-tab:not(.on):hover .ib-hov{opacity:.5;transform:scaleY(1.5)}
.ib.anim .ib-hov{opacity:0!important;transition:none}
.ib-tt{position:relative;z-index:1;flex:1 1 auto;min-width:0;padding:clamp(18px,2.4vw,28px) 0 0 clamp(8px,1vw,14px);margin-bottom:72px;writing-mode:vertical-rl;text-orientation:mixed;font:600 clamp(15px,1.6vw,21px)/1.1 var(--fl);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;opacity:.72;text-shadow:0 0 18px #000;transition:opacity .6s ease-out,color .4s ease-out}
.ib-tab.on .ib-tt{opacity:1;color:#fff}
.ib-tab.on{cursor:default}
.ib-pg{position:absolute;z-index:1;right:clamp(8px,1vw,14px);bottom:clamp(28px,3.6vw,48px);font:600 clamp(13px,1.2vw,16px) var(--fl);letter-spacing:.08em;opacity:.85;transition:color .4s}
.ib-tab.on .ib-pg{color:var(--red-hi);opacity:1}
.ib-mk{position:absolute;left:0;top:0;width:3px;height:0;background:var(--red);box-shadow:0 0 14px var(--red);transition:height .6s cubic-bezier(.2,.8,.2,1) .4s}
.ib-tab.on .ib-mk{height:clamp(60px,10vw,110px)}
.ib-divs{position:absolute;top:0;bottom:0;right:0;width:calc(100% - var(--stage));z-index:4;pointer-events:none}
.ib-divs i{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.7)}
.ib-hint{display:flex;justify-content:center;gap:18px;margin-top:16px;font:500 12px var(--fl);letter-spacing:.12em;text-transform:uppercase;color:#94a3b8}
.ib-hint kbd{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 5px;border-radius:5px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);font:600 11px var(--fl);color:#e5e7eb}
@media (max-width:860px){
 .ib{--stage:52%;min-height:600px}
 .ib::before{background:linear-gradient(90deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.2) 85%),linear-gradient(0deg,rgba(0,0,0,.6),transparent 50%)}
 .ib-chips{display:none}
 .ib-tt{margin-bottom:56px;padding-left:6px;font-size:14px;letter-spacing:.1em}
 .ib-tab{padding-right:4px}
 .ib-pg{right:6px}
 .ib-hint{display:none}
 .ib-ctar{display:none}
 .ib-cta{padding:11px 16px;font-size:13px}
}


@media (max-width:860px){
 .sq-row{flex-direction:column;height:auto;padding-left:0}
 .sq-p{--cut:0px;margin:0 0 8px;flex:0 0 76px;clip-path:inset(0 round 14px);transition:flex-basis .75s var(--ease)}
 .sq-p.on{flex:0 0 640px}
 .sq-lbl{left:22px;right:22px;bottom:50%;translate:0 50%;flex-direction:row;justify-content:flex-start}

  st.addEventListener('keydown',e=>{const d={ArrowRight:1,ArrowLeft:-1}[e.key];if(d){e.preventDefault();pick((cur+d+M)%M,'deck',true)}if(e.key==='Enter'&&e.target.classList.contains('dk-c')){const c=e.target;c.style.setProperty('--flip',c.style.getPropertyValue('--flip')==='1'?0:1)}})},
 info(r,i){return `<div class="dk-sl"><div class="ov"><span class="code">${ic(r.k)}${r.code} · Role ${i+1} of ${N}</span><h2>${r.t}</h2>${full(r)}<p class="sq-tag">${r.tag}</p><p class="sq-d">${r.d}</p></div><div class="dt" aria-hidden="true" inert><p class="dt-name">${ic(r.k)}${r.t}<span>· The details</span></p>${detail(r,0)}</div></div><div class="sq-act">${cta(r)}${more(r)}</div>`},
 set(i,anim,focus){const sel=$('#dksel');sel.style.setProperty('--i',i);$$('button',sel).forEach((b,j)=>{b.setAttribute('aria-selected',j===i);b.tabIndex=j===i?0:-1;if(j===i&&focus==='sel')b.focus()});
   const cs=$$('#dkst .dk-c');cs.forEach((c,j)=>{let d=j-i;if(d>M/2)d-=M;if(d<-M/2)d+=M;const a=Math.abs(d);

VIEWS.orig=(()=>{
const ROLES=window.MR_ROLES.map(r=>({k:r.k,t:r.t,tag:r.tag,d:r.d,c:r.perks.slice(0,3),img:r.img,pos:r.pos,code:r.code}));
const N=ROLES.length,ib=$('#ib'),bg=$('#ibbg'),st=$('#ibst'),tabs=$('#ibtabs'),divs=$('#ibdivs'),full=$('.ib-tr .full'),bar=$('.ib-tr .bar');
const ARW='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const L='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',Rr='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const mode=()=>$('#v-orig').dataset.s||'1';
ib.style.setProperty('--n',N);
bg.innerHTML=ROLES.map((r,i)=>`<div class="ib-img" data-i="${i}" style="--img:var(${r.img});--pos:${r.pos}"></div>`).join('')+'<div class="ib-prev" aria-hidden="true"></div>';
st.innerHTML=ROLES.map((r,i)=>`<div class="ib-slide" data-i="${i}" id="ibp-${r.k}" role="tabpanel" aria-labelledby="ibt-${r.k}"><div class="ib-det"><p class="ib-num">Role ${pad(i+1)}</p><h2>${r.t}</h2><p class="ib-tag">${r.tag}</p><p class="d">${r.d}</p><ul class="ib-chips">${r.c.map(x=>`<li>${x}</li>`).join('')}</ul></div>${cta(window.MR_ROLES[i])}</div>`).join('')
 +`<div class="ib-nav"><button type="button" class="ib-nb" data-d="-1" aria-label="Previous role">${L}</button><span class="ib-cnt" aria-live="polite"><b>01</b> / ${pad(N)}</span><button type="button" class="ib-nb" data-d="1" aria-label="Next role">${Rr}</button></div>`
 +`<div class="ib-rail" aria-hidden="true">${ROLES.map((r,i)=>`<i data-i="${i}"><span>${r.t}</span></i>`).join('')}</div>`;
divs.innerHTML=ROLES.map((_,p)=>`<i style="left:calc(${p} * 100% / ${N})"></i>`).join('');
tabs.innerHTML='<i class="ib-glide" aria-hidden="true"></i>'+ROLES.map((r,i)=>`<div class="ib-cell" data-i="${i}" style="left:calc(${i} * 100% / ${N})"><button class="ib-tab" type="button" role="tab" id="ibt-${r.k}" aria-controls="ibp-${r.k}" aria-selected="false" tabindex="-1"><span class="ib-hov"></span><span class="ib-mk"></span><span class="ib-tt">${r.t}</span><span class="ib-pick" aria-hidden="true">${Rr}</span><span class="ib-pg">${pad(i+1)}</span></button></div>`).join('');
const cells=$$('.ib-cell',tabs),glide=$('.ib-glide',tabs),prev=$('.ib-prev',bg);
let order=ROLES.map((_,i)=>i),act=-1,timers=[],anims=[];
const posOf=i=>mode()==='2'?order.indexOf(i):i;
function layout(){cells.forEach(c=>{const i=+c.dataset.i;c.style.left=`calc(${posOf(i)} * 100% / ${N})`});glide.style.left=`calc(${posOf(act<0?0:act)} * 100% / ${N})`}
function paint(i){$$('.ib-img',bg).forEach(e=>e.classList.toggle('on',+e.dataset.i===i));
  $$('.ib-slide',st).forEach(e=>{const on=+e.dataset.i===i;e.classList.toggle('on',on);e.setAttribute('aria-hidden',!on);e.inert=!on});
  $('.ib-cnt b',st).textContent=pad(i+1);$$('.ib-rail i',st).forEach(e=>{const j=+e.dataset.i;e.classList.toggle('on',j===i);e.classList.toggle('past',j<i)})}
function marks(i){cells.forEach(c=>{const on=+c.dataset.i===i,b=$('.ib-tab',c);b.classList.toggle('on',on);b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1})}
function stop(){timers.forEach(clearTimeout);timers=[];anims.forEach(a=>a.cancel());anims=[]}
function sweep(fromX,dir){const W=ib.clientWidth,tw=tabs.clientWidth/N;full.style.width=W*1.2+'px';bar.style.width=tw+'px';
  const o={duration:620,easing:'cubic-bezier(.55,0,.25,1)',fill:'forwards'};
  if(dir>0){anims.push(full.animate([{transform:`translateX(${fromX+tw}px)`},{transform:`translateX(${-W*1.25}px)`}],o));anims.push(bar.animate([{transform:`translateX(${fromX}px)`},{transform:`translateX(${-W*1.25-tw}px)`}],o))}
  else{anims.push(full.animate([{transform:`translateX(${-W*1.2-tw}px)`},{transform:`translateX(${W*1.3}px)`}],o));anims.push(bar.animate([{transform:`translateX(${-tw}px)`},{transform:`translateX(${W*2.5}px)`}],o))}}
function set(i,anim,focus){
  const m=mode(),old=act;stop();
  if(old<0||!anim||still||i===old){if(m==='2'){const k=order.indexOf(i);order=[...order.slice(k),...order.slice(0,k)]}act=i;layout();marks(i);paint(i);if(focus)$('#ibt-'+ROLES[i].k).focus();return}
  const tx=tabs.offsetLeft,tw=tabs.clientWidth/N,fromPos=posOf(i),fromX=tx+fromPos*tw;
  act=i;marks(i);
  if(m==='2'){const before=new Map(cells.map(c=>[c,c.getBoundingClientRect().left]));const k=order.indexOf(i);order=[...order.slice(k),...order.slice(0,k)];layout();
    cells.forEach(c=>{const dx=before.get(c)-c.getBoundingClientRect().left;if(dx)anims.push(c.animate([{transform:`translateX(${dx}px)`},{transform:'none'}],{duration:480,easing:'cubic-bezier(.3,.8,.25,1)'}))})}
  else layout();
  const dir=m==='3'?(i>old?1:-1):1;
  sweep(fromX,dir);
  timers.push(setTimeout(()=>paint(i),230));
  if(focus)$('#ibt-'+ROLES[i].k).focus({preventScroll:true});

tabs.addEventListener('click',e=>{const c=e.target.closest('.ib-cell');if(c)pick(+c.dataset.i,'orig')});
tabs.addEventListener('keydown',e=>{const a=act;let n=null;if(e.key==='ArrowRight'||e.key==='ArrowDown')n=(a+1)%N;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')n=(a-1+N)%N;else if(e.key==='Home')n=0;else if(e.key==='End')n=N-1;if(n==null)return;e.preventDefault();pick(n,'orig',true)});
$$('.ib-nb',st).forEach(b=>b.onclick=()=>pick((act+ +b.dataset.d+N)%N,'orig'));
cells.forEach(c=>{const i=+c.dataset.i;c.addEventListener('mouseenter',()=>{if(mode()!=='3'||i===act)return;prev.style.setProperty('--img',`var(${ROLES[i].img})`);prev.style.setProperty('--pos',ROLES[i].pos);prev.classList.add('on')});c.addEventListener('mouseleave',()=>prev.classList.remove('on'));c.addEventListener('click',()=>prev.classList.remove('on'))});
let sx=null;ib.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')sx=e.clientX});ib.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>50)pick((act+(dx<0?1:-1)+N)%N,'orig')});
return {init(){},set(i,anim,focus){set(i,anim,focus)},reset(){order=ROLES.map((_,i)=>i);act=-1}};
})();

function detMode(host,on,focus){if(!host)return;const was=host.classList.contains('det');if(was===on)return;host.classList.toggle('det',on);
  const dt=$('.sq-dt,.dt',host),ov=$('.sq-info,.dk-sl>.ov',host);if(dt){dt.setAttribute('aria-hidden',!on);dt.inert=!on}if(ov){ov.inert=on}
  $$('[data-toggle]',host).forEach(b=>b.setAttribute('aria-expanded',on));
  const sc=$('.sq-dt',host);if(sc)sc.scrollTop=0;


  if(focus){const t=$('.sq-tab',host)&&getComputedStyle($('.sq-tab',host)).display!=='none'?$('.sq-tab',host):$('[data-toggle]',host);t&&t.focus({preventScroll:true})}}
document.addEventListener('click',e=>{const m=e.target.closest('[data-toggle]');if(!m)return;e.preventDefault();e.stopPropagation();const host=m.closest('.sq-p,.dk-info');if(host.classList.contains('sq-p')&&!host.classList.contains('on')){pick(+host.dataset.i,'squad');return}detMode(host,!host.classList.contains('det'),true)},true);

function pick(i,from,focus){if(i===cur&&from)return;cur=i;const v=VIEWS[view];v&&v.set(view==='orig'?Math.min(i,N-1):i,true,focus);try{localStorage.setItem('mr-role',T[i].k)}catch(_){}url()}
let view=null;
const SUB={squad:['Slanted panels','Straight columns','Stacked rows'],deck:['Fanned deck','Flat carousel','Card stack'],orig:['Fixed tabs','Followable reshuffle','Direction-aware wipe']};
const LET={squad:'A',deck:'B',orig:'C'};
let subs={squad:'1',deck:'1',orig:'1'};try{Object.assign(subs,JSON.parse(localStorage.getItem('mr-roles-subs')||'{}'))}catch(_){}
function url(){try{history.replaceState(null,'','?d='+view+'&s='+subs[view]+'&role='+T[cur].k)}catch(_){}}
function setSub(v,n,re){subs[v]=String(n);$('#v-'+v).dataset.s=subs[v];
  $('#ssw').innerHTML=`<span class="ssw-l">${LET[v]} variants</span>`+SUB[v].map((t,j)=>`<button type="button" data-s="${j+1}" aria-pressed="${String(j+1)===subs[v]}"><b>${LET[v]}${j+1}</b>${t}</button>`).join('');
  $$('#ssw button').forEach(b=>b.onclick=()=>setSub(v,b.dataset.s,true));
  try{localStorage.setItem('mr-roles-subs',JSON.stringify(subs))}catch(_){}
  if(re){const V=VIEWS[v];$$('.det',$('#v-'+v)).forEach(h=>detMode(h,false));if(v==='squad'&&V.sk)V.sk();if(v==='orig'){V.reset&&V.reset();V.set(cur>=N?0:cur,false)}else V.set(cur,false);url()}}
function show(v){if(!VIEWS[v])v='squad';view=v;$$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));$$('#vsw button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));

$$('#vsw button').forEach(b=>b.onclick=()=>show(b.dataset.v));

const ri=T.findIndex(r=>r.k===(q.get('role')||sr));if(ri>=0)cur=ri;
