<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fleet planner</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<script src="./js/fleet-data.js"></script>
<script src="./js/fleet-geo.js"></script>
<script src="./js/scene-data.js"></script>
<script src="./js/fleet-store.js"></script>
<script src="./js/fleet-model.js"></script>
<script src="./js/fleet-briefing.js"></script>
<script src="./js/scene-view.js"></script>
<script src="./js/scene-input.js"></script>
<script src="./js/main-actions.js"></script>
<script src="./js/main-keys.js"></script>
<script src="./js/main-bridge.js"></script>
<script src="./js/main-menus.js"></script>
<script src="./js/panel-view.js"></script>
<script src="./js/overlay-view.js"></script>
<script src="./js/main-view.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Mohave:wght@700&family=Oxanium:wght@500;700&family=Quantico:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<sc-if value="{{booting}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; background: #0d1522; color: #9CA3AF; font-family: Inter, sans-serif; font-size: 14px">Loading planner…</div>
</sc-if>
<sc-if value="{{booted}}" hint-placeholder-val="{{ true }}">
<div data-root="1" data-section="viewport" onMouseOver="{{over}}" onMouseMove="{{laserMove}}" onKeyDown="{{rootKey}}" style="outline: none; user-select: none; -webkit-user-select: none; position: relative; width: {{vw}}px; height: {{vh}}px; overflow: hidden; background: #0d1522">
<div data-section="page" style="position: absolute; left: {{fx}}px; top: {{fy}}px; width: 1440px; height: 900px; overflow: hidden; transform: scale({{fit}}); transform-origin: top left; background: #1F2937; font-family: Inter, sans-serif; color: #E5E7EB">
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
<defs>
<symbol id="fighter" viewBox="0 0 48 28">
<g fill="currentColor" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round">
<polygon points="12,11 22,1 30,12" fill-opacity="0.7"/>
<polygon points="12,17 22,27 30,16" fill-opacity="0.4"/>
<polygon points="2,14 16,9 44,14 16,19" fill-opacity="0.55"/>
<polygon points="16,9 44,14 26,14" fill-opacity="0.95"/>
<polygon points="16,19 44,14 26,14" fill-opacity="0.3"/>
</g>
</symbol>
<symbol id="gunship" viewBox="0 0 64 36">
<g fill="currentColor" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round">
<polygon points="14,14 30,3 40,15" fill-opacity="0.7"/>
<polygon points="14,22 30,33 40,21" fill-opacity="0.4"/>
<polygon points="4,18 20,10 58,18 20,26" fill-opacity="0.55"/>
<polygon points="20,10 58,18 34,18" fill-opacity="0.95"/>
<polygon points="20,26 58,18 34,18" fill-opacity="0.3"/>
<polygon points="26,7 33,7 36,12 28,12" fill-opacity="0.95"/>
<polygon points="26,29 33,29 36,24 28,24" fill-opacity="0.6"/>
</g>
</symbol>
<symbol id="scout" viewBox="0 0 52 30">
<g fill="currentColor" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round">
<polygon points="10,15 26,2 34,14" fill-opacity="0.7"/>
<polygon points="10,15 26,28 34,16" fill-opacity="0.4"/>
<polygon points="2,15 22,10 50,15 22,20" fill-opacity="0.55"/>
<polygon points="22,10 50,15 30,15" fill-opacity="0.95"/>
<polygon points="22,20 50,15 30,15" fill-opacity="0.3"/>
</g>
<circle cx="42" cy="15" r="2.6" fill="#F9FAFB"/>
</symbol>
<symbol id="medical" viewBox="0 0 52 32">
<g fill="currentColor" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round">
<polygon points="16,4 36,4 40,8 12,8" fill-opacity="0.65"/>
<polygon points="2,16 12,8 40,8 50,16" fill-opacity="0.9"/>
<polygon points="2,16 12,24 40,24 50,16" fill-opacity="0.35"/>
</g>
<path d="M24 10h4v4h4v4h-4v4h-4v-4h-4v-4h4z" fill="#F9FAFB"/>
</symbol>
<symbol id="cutlass" viewBox="0 0 52 32">
<g fill="currentColor" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round">
<polygon points="14,10 24,2 34,10" fill-opacity="0.7"/>
<polygon points="14,22 24,30 34,22" fill-opacity="0.4"/>
<polygon points="4,10 40,10 50,16 40,22 4,22" fill-opacity="0.5"/>
<polygon points="4,10 40,10 50,16 4,16" fill-opacity="0.9"/>
</g>
<circle cx="22" cy="16" r="5.5" fill="none" stroke="#F9FAFB" stroke-width="1.2"/>
<path d="M22 12.5v7M18.5 16h7" stroke="#F9FAFB" stroke-width="1.4" fill="none"/>
</symbol>
<symbol id="freight" viewBox="0 0 64 30">
<g fill="currentColor" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round">
<polygon points="8,4 20,4 24,8 12,8" fill-opacity="0.8"/>
<polygon points="26,4 38,4 42,8 30,8" fill-opacity="0.8"/>
<polygon points="4,8 44,8 60,15 44,22 4,22" fill-opacity="0.5"/>
<polygon points="4,8 44,8 60,15 18,15" fill-opacity="0.9"/>
<polygon points="0,10 4,10 4,20 0,20" fill-opacity="0.95"/>
</g>
</symbol>
<symbol id="capital" viewBox="0 0 120 44">
<g fill="currentColor" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round">
<polygon points="20,10 34,2 40,12" fill-opacity="0.7"/>
<polygon points="20,34 34,42 40,32" fill-opacity="0.4"/>
<polygon points="2,22 26,12 108,18 118,22 108,26 26,32" fill-opacity="0.5"/>
<polygon points="26,12 108,18 118,22 60,22" fill-opacity="0.9"/>
<polygon points="26,32 108,26 118,22 60,22" fill-opacity="0.3"/>
<polygon points="50,6 80,8 86,15 44,13" fill-opacity="0.75"/>
</g>
</symbol>
</defs>
</svg>

<div data-section="map" style="position: absolute; left: 0; top: {{sceneTop}}px; width: 1440px; height: {{sceneH}}px; overflow: hidden">
<dc-import name="Scene" w="1440" h="{{sceneH}}" ghosts="{{ghosts}}" labels="{{labelsProp}}" rings="{{ringsProp}}" paths="{{pathsProp}}" routes="{{routesProp}}" dim="{{dimList}}" spot="{{spotStr}}" multi="{{multiStr}}" hl="{{hoverH}}" sel="{{selH}}" offs="{{offsJson}}" meta="{{metaJson}}" zones="{{zonesJson}}" wps="{{wpsJson}}" sq="{{sqJson}}" meas="{{measStr}}" tool="{{toolId}}" snap="{{snapProp}}" play-t="{{playProp}}" pins="{{pinsJson}}" extra="{{extraJson}}" markers="{{markersJson}}" annos="{{annosJson}}" arcs="{{arcsJson}}" diff="{{diffJson}}" lbl="{{lblJson}}" view="{{viewJson}}" on-view="{{onView}}" txt="{{txtJson}}" tidy="{{tidyN}}" anno-mode="{{annoMode}}" mpath="{{mpathId}}" on-pick="{{onPick}}" on-move="{{onMove}}" on-zone="{{onZone}}" on-zones="{{onZones}}" on-wps="{{onWps}}" on-ctx="{{onCtx}}" on-rename="{{onRename}}" on-note="{{onNote}}" on-box="{{onBox}}" on-sel="{{onSel}}" on-pin="{{onPin}}" on-map-click="{{onMapClick}}" on-markers="{{onMarkers}}" on-anno-draw="{{onAnnoDraw}}" on-label-offs="{{onLabelOffs}}" hint-size="1440px,804px"></dc-import>

<sc-if value="{{notPres}}" hint-placeholder-val="{{ true }}">
<div data-section="map-controls">

<div data-section="tool-rail" style="position: absolute; left: 16px; top: 12px; width: 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 3px; padding: 6px; border-radius: 8px; background: rgba(13,21,34,0.92); border: 1px solid #334155">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="10">
<button type="button" onClick="{{t.pick}}" aria-label="{{t.label}}" aria-pressed="{{t.on}}" data-tip="{{t.tip}}" style="width: 34px; height: 33px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: {{t.color}}; border: 1px solid {{t.border}}; background: {{t.bg}}">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"/></svg>
</button>
</sc-for>
<div style="height: 1px; background: #334155; margin: 2px 0"></div>
<button type="button" onClick="{{toggleSnap}}" aria-label="Snap to rings" aria-pressed="{{snapPressed}}" data-tip="Snap to rings (S): dragged ships lock onto their squadron's orbit ring." style="width: 34px; height: 33px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: {{snapColor}}; border: 1px solid {{snapBorder}}; background: {{snapBg}}">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v8a6 6 0 0012 0V3M6 3h4v8M14 3h4v8M6 7h4M14 7h4"/></svg>
</button>
<button type="button" onClick="{{openHelp}}" aria-label="Keyboard shortcuts" data-tip="Shortcuts (?): every keyboard and mouse shortcut in one list." style="width: 34px; height: 33px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #D1D5DB; border: 1px solid transparent; background: transparent; font-family: Oxanium, sans-serif; font-weight: 700; font-size: 15px">?</button>
</div>

<div data-section="filters" style="position: absolute; left: 80px; top: 12px; display: flex; align-items: center; gap: 6px; height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; background: rgba(13,21,34,0.92); border: 1px solid #334155">
<span data-tip="Role filter: show only ships of these wiki roles. Ships that don't match are dimmed." style="font-family: Mohave, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 13px; color: #9CA3AF">Role</span>
<sc-for list="{{roleChips}}" as="c" hint-placeholder-count="7">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" data-tip="{{c.tip}}" style="height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; cursor: pointer; color: {{c.color}}; border: 1px solid {{c.border}}; background: {{c.bg}}">{{c.label}}</button>
</sc-for>
<span style="width: 1px; height: 20px; background: #374151; margin: 0 6px"></span>
<span data-tip="Status filter: show only ships in the chosen states." style="font-family: Mohave, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 13px; color: #9CA3AF">Status</span>
<sc-for list="{{statusChips}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.pick}}" aria-label="{{c.label}}" aria-pressed="{{c.on}}" data-tip="{{c.tip}}" style="width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid {{c.border}}; background: {{c.bg}}"><span style="width: 8px; height: 8px; background: {{c.color}}"></span></button>
</sc-for>
<sc-if value="{{filtersOn}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{clearFilters}}" data-tip="Clear filters: show every ship at full strength." style="height: 26px; padding: 0 10px; margin-left: 4px; border-radius: 13px; font-size: 12px; cursor: pointer; color: #F87171; border: 1px solid rgba(248,113,113,0.6); background: transparent">Clear</button>
</sc-if>
</div>

<div data-section="declutter" data-txt="1" style="position: absolute; left: 846px; top: 12px; display: flex; align-items: center; gap: 6px; height: 40px">
<button type="button" onClick="{{toggleClean}}" aria-pressed="{{clean}}" data-tip="Hide labels (H): clear every label off the map in one go. The selected and hovered ship still show theirs. Press again to bring them back." style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; color: {{cleanColor}}; background: {{cleanBg}}; border: 1px solid {{cleanBorder}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6zM4 20L20 4"/></svg>{{cleanLabel}}</button>
<button type="button" onClick="{{toggleTxt}}" aria-expanded="{{txtOpen}}" data-tip="Labels: choose which kinds of map text to show, and how much each ship label says." style="display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; color: #D1D5DB; background: rgba(13,21,34,0.92); border: 1px solid #334155">Labels<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
<sc-if value="{{txtOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 40px; width: 250px; box-sizing: border-box; padding: 8px; border-radius: 8px; background: #0d1522; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5)">
<div style="font-family: Mohave, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; color: #9CA3AF; margin-bottom: 4px">Ship labels</div>
<div style="display: flex; gap: 4px; margin-bottom: 8px">
<sc-for list="{{shipModes}}" as="m" hint-placeholder-count="3">
<button type="button" onClick="{{m.act}}" data-tip="{{m.tip}}" style="flex: 1; height: 24px; border-radius: 12px; font-size: 11px; cursor: pointer; color: {{m.color}}; border: 1px solid {{m.border}}; background: {{m.bg}}">{{m.label}}</button>
</sc-for>
</div>
<div style="font-family: Mohave, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; color: #9CA3AF; margin-bottom: 2px">Other text</div>
<sc-for list="{{txtRows}}" as="r" hint-placeholder-count="7">
<button type="button" onClick="{{r.act}}" aria-pressed="{{r.on}}" data-tip="{{r.tip}}" style="display: flex; align-items: center; gap: 8px; width: 100%; height: 26px; padding: 0 6px; border: 0; border-radius: 4px; cursor: pointer; text-align: left; font-size: 12px; color: {{r.color}}; background: transparent">
<span style="width: 14px; height: 14px; flex: none; border-radius: 3px; border: 1px solid #4B5563; font-size: 11px; line-height: 13px; text-align: center; color: #FBBF24">{{r.mark}}</span>{{r.label}}</button>
</sc-for>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin-top: 6px">
<button type="button" onClick="{{txtAll}}" style="height: 24px; border-radius: 4px; font-size: 11px; cursor: pointer; color: #E5E7EB; background: transparent; border: 1px solid #4B5563">Show all</button>
<button type="button" onClick="{{txtNone}}" data-tip="Minimal: compact ship labels and nothing else." style="height: 24px; border-radius: 4px; font-size: 11px; cursor: pointer; color: #E5E7EB; background: transparent; border: 1px solid #4B5563">Minimal</button>
</div>
</div>
</sc-if>
</div>

<div data-section="hint" style="position: absolute; left: 80px; top: 58px; height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 10px; border-radius: 13px; background: rgba(13,21,34,0.9); border: 1px solid {{hintBorder}}; font-size: 11px; color: #D1D5DB; white-space: nowrap">
<span style="padding-right: 6px">{{hint}}</span>
<sc-if value="{{noteUndo}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{undo}}" data-tip="Undo: reverse the change you just made." style="height: 20px; padding: 0 10px; border-radius: 10px; font-size: 11px; font-weight: 600; cursor: pointer; color: #111827; background: #FBBF24; border: 0">Undo</button>
</sc-if>
</div>

<sc-if value="{{subOn}}" hint-placeholder-val="{{ false }}">
<div data-section="tool-options" style="position: absolute; left: 80px; top: 92px; display: flex; align-items: center; gap: 6px; height: 32px; box-sizing: border-box; padding: 0 6px 0 12px; border-radius: 8px; background: rgba(13,21,34,0.95); border: 1px solid #334155">
<span style="font-size: 11px; color: #9CA3AF">{{subLabel}}</span>
<sc-for list="{{subChips}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.act}}" data-tip="{{c.tip}}" style="height: 22px; padding: 0 10px; border-radius: 11px; font-size: 11px; cursor: pointer; color: {{c.color}}; border: 1px solid {{c.border}}; background: {{c.bg}}">{{c.label}}</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{multiOn}}" hint-placeholder-val="{{ false }}">
<div data-section="group-bar" style="position: absolute; left: 80px; top: 130px; display: flex; align-items: center; gap: 6px; height: 34px; box-sizing: border-box; padding: 0 6px 0 12px; border-radius: 8px; background: rgba(13,21,34,0.95); border: 1px solid #A78BFA">
<span style="font-size: 12px; font-weight: 600; color: #C4B5FD">{{multiCount}} selected</span>
<span style="font-size: 11px; color: #9CA3AF">Move to</span>
<sc-for list="{{groupTargets}}" as="g" hint-placeholder-count="4">
<button type="button" onClick="{{g.act}}" data-tip="{{g.tip}}" style="height: 24px; padding: 0 10px; border-radius: 12px; font-size: 11px; cursor: pointer; color: {{g.color}}; border: 1px solid {{g.color}}; background: transparent">{{g.label}}</button>
</sc-for>
<button type="button" onClick="{{clearMulti}}" data-tip="Clear selection (Esc)." style="height: 24px; padding: 0 10px; border-radius: 12px; font-size: 11px; cursor: pointer; color: #D1D5DB; border: 1px solid #4B5563; background: transparent">Clear</button>
</div>
</sc-if>

<sc-if value="{{playOn}}" hint-placeholder-val="{{ false }}">
<div data-section="playback" style="position: absolute; left: 560px; top: 58px; width: 440px; height: 30px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 15px; background: rgba(13,21,34,0.94); border: 1px solid rgba(34,211,238,0.5)">
<button type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}" data-tip="Route playback (Space): fly ships along their routes and threats along their paths." style="width: 22px; height: 22px; padding: 0; border-radius: 11px; border: 0; cursor: pointer; background: #22D3EE; color: #111827; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{playIcon}}"/></svg></button>
<button type="button" onClick="{{stopPlay}}" aria-label="Stop playback" data-tip="Stop: return everything to its planned position." style="width: 22px; height: 22px; padding: 0; border-radius: 11px; border: 1px solid #4B5563; cursor: pointer; background: transparent; color: #D1D5DB; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 5h14v14H5z"/></svg></button>
<input type="range" min="0" max="{{playMax}}" step="0.5" value="{{playT}}" onChange="{{seek}}" aria-label="Playback time" style="flex: 1; min-width: 0; accent-color: #22D3EE">
<span style="font-family: Oxanium, sans-serif; font-size: 11px; color: #E5E7EB; white-space: nowrap">{{playTxt}}</span>
<sc-for list="{{rates}}" as="r" hint-placeholder-count="3">
<button type="button" onClick="{{r.act}}" data-tip="{{r.tip}}" style="height: 20px; padding: 0 6px; border-radius: 10px; border: 1px solid #22D3EE; cursor: pointer; font-size: 10px; color: {{r.color}}; background: {{r.bg}}">{{r.label}}</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{mmShow}}" hint-placeholder-val="{{ true }}">
<div data-section="mini-map" style="position: absolute; left: 80px; bottom: 52px; box-sizing: border-box; padding: 4px; border-radius: 8px; background: rgba(13,21,34,0.94); border: 1px solid #334155">
<div style="display: flex; align-items: center; gap: 4px; height: 20px">
<button type="button" onClick="{{mmToggle}}" aria-label="Collapse mini-map" data-tip="Mini-map: overview of the whole scene. Click to collapse or expand." style="display: flex; align-items: center; gap: 4px; height: 20px; padding: 0 4px; border: 0; background: transparent; cursor: pointer; color: #D1D5DB; font-family: Mohave, sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{mmChev}}"/></svg>Mini-map</button>
<span style="flex: 1; min-width: 8px"></span>
<button type="button" onClick="{{zoomOut}}" aria-label="Zoom out" data-tip="Zoom out (−): see more of the area. Scroll the mouse wheel over the map to zoom where you point." style="width: 20px; height: 18px; padding: 0; border-radius: 9px; border: 1px solid #4B5563; cursor: pointer; font-size: 13px; line-height: 14px; color: #E5E7EB; background: transparent">−</button>
<button type="button" onClick="{{zoomReset}}" data-tip="Reset view (Home): back to 100%, centred on Crusader." style="min-width: 40px; height: 18px; padding: 0 4px; border-radius: 9px; border: 1px solid #4B5563; cursor: pointer; font-family: Oxanium, sans-serif; font-size: 10px; color: #E5E7EB; background: transparent">{{zoomTxt}}</button>
<button type="button" onClick="{{zoomIn}}" aria-label="Zoom in" data-tip="Zoom in (+): get closer. Drag empty space, or hold the middle mouse button, to pan." style="width: 20px; height: 18px; padding: 0; border-radius: 9px; border: 1px solid #4B5563; cursor: pointer; font-size: 13px; line-height: 14px; color: #E5E7EB; background: transparent">+</button>
<span style="width: 4px"></span>
<sc-for list="{{mmSizes}}" as="r" hint-placeholder-count="2">
<button type="button" onClick="{{r.act}}" data-tip="{{r.tip}}" style="height: 18px; padding: 0 6px; border-radius: 9px; border: 1px solid #22D3EE; cursor: pointer; font-size: 10px; color: {{r.color}}; background: {{r.bg}}">{{r.label}}</button>
</sc-for>
</div>
<sc-if value="{{mmOpen}}" hint-placeholder-val="{{ true }}">
<svg width="{{mmW}}" height="{{mmH}}" viewBox="0 0 {{mmW}} {{mmH}}" role="img" aria-label="Mini-map of the fleet. Click to move the view there." onClick="{{mmJump}}" data-tip="Mini-map: click anywhere to move the view there. The dashed box is what the map shows." style="display: block; margin-top: 4px; border-radius: 4px; background: #05080f; cursor: pointer">
<circle cx="{{mmPX}}" cy="{{mmPY}}" r="{{mmPR}}" fill="#B45309" fill-opacity="0.55"/>
<sc-for list="{{mmZones}}" as="z" hint-placeholder-count="0">
<rect x="{{z.x}}" y="{{z.y}}" width="{{z.w}}" height="{{z.h}}" fill="{{z.c}}" fill-opacity="0.15" stroke="{{z.c}}" stroke-width="0.8"/>
</sc-for>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
// Fleet planner shell. Logic lives in ./js/: data, geometry, model, actions, keys, bridge, menus and the view builders.
// The side panel, roster and overlays are their own components (RightPanel, Roster, Overlays), fed by `v` props.
const MIXINS = () => [window.FleetActions, window.FleetKeys, window.FleetBridge];
const READY = () => !!(window.FleetMainView && window.FleetPanelView && window.FleetOverlayView && window.FleetMenus && MIXINS().every(Boolean));
class Component extends DCLogic {
constructor(...args) {
super(...args);
if (READY()) { Object.assign(Object.getPrototypeOf(this), ...MIXINS()); this._mixed = true; this.state = window.FleetActions.initialState(); }
else this.state = { booting: true };
}
renderVals() {
if (!this._mixed) {
if (READY()) {
Object.assign(Object.getPrototypeOf(this), ...MIXINS());
this._mixed = true;
setTimeout(() => { this.setState(window.FleetActions.initialState()); setTimeout(() => this.componentDidMount(), 0); }, 0);
} else if (!this._wait) {
this._wait = setInterval(() => { if (READY()) { clearInterval(this._wait); this.forceUpdate(); } }, 50);
}
return { booting: true, booted: false };
}
if (this.state.booting) return { booting: true, booted: false };
return Object.assign({ booting: false }, window.FleetMainView.compute(this));
}
}
</script>
